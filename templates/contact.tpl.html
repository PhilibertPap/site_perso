<section class="contact-section">
    <div class="container">
        <div class="section-header mb-5">
            <h1 class="section-title">{{ui.contact.title}}</h1>
            <p class="section-subtitle">{{ui.contact.subtitle}}</p>
        </div>

        <div class="contact-card">
            <form
                id="contact-form"
                action="https://formspree.io/f/mnjrrqrk"
                method="POST"
                novalidate
            >
                <!-- reCAPTCHA v3 -->
                <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response" />
                <div class="contact-field">
                    <label for="contact-name" class="contact-label">{{ui.contact.name_label}}</label>
                    <input
                        type="text"
                        id="contact-name"
                        name="name"
                        class="contact-input"
                        placeholder="{{ui.contact.name_placeholder}}"
                        required
                        autocomplete="name"
                    />
                </div>

                <div class="contact-field">
                    <label for="contact-email" class="contact-label">{{ui.contact.email_label}}</label>
                    <input
                        type="email"
                        id="contact-email"
                        name="email"
                        class="contact-input"
                        placeholder="{{ui.contact.email_placeholder}}"
                        required
                        autocomplete="email"
                    />
                </div>

                <div class="contact-field">
                    <label for="contact-message" class="contact-label">{{ui.contact.message_label}}</label>
                    <textarea
                        id="contact-message"
                        name="message"
                        class="contact-input contact-textarea"
                        placeholder="{{ui.contact.message_placeholder}}"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <div id="contact-feedback" class="contact-feedback" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary contact-submit">
                    {{ui.contact.submit}}
                </button>
            </form>

            <div class="contact-alt">
                <p class="contact-alt-email">
                    <a href="mailto:philibert.pappens@gmail.com" data-email-link="true">philibert.pappens@gmail.com</a>
                </p>
                <div class="contact-alt-links">
                    <a href="https://linkedin.com/in/philibert-pappens-993468313" class="contact-alt-link" data-linkedin-link="true" target="_blank" rel="noopener">LinkedIn</a>
                    <a href="https://github.com/PhilibertPap" class="contact-alt-link" data-github-link="true" target="_blank" rel="noopener">GitHub</a>
                </div>
            </div>
        </div>
    </div>
</section>
