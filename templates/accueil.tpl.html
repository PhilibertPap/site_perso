<section class="hero-section">
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-6">
        <div class="hero-content">
          <p class="hero-badge">
            <span class="badge-dot"></span>
            {{ui.accueil.badge}}
          </p>
          <h1 class="hero-title">{{nom}}</h1>
          <p class="hero-subtitle">{{ui.accueil.subtitle}}</p>

          <div class="hero-skills mb-5">
            {{#ui.accueil.skills}}
            <span class="skill-tag">{{.}}</span>
            {{/ui.accueil.skills}}
          </div>

          <div class="hero-cta">
            <a
              href="#"
              data-page="projets"
              class="btn btn-primary btn-lg js-nav"
            >
              {{ui.accueil.cta_projects}}
              <span class="btn-arrow">→</span>
            </a>
            <a href="{{ui.accueil.cv_url}}" target="_blank" class="btn btn-outline-primary btn-lg" download>
              {{ui.accueil.cta_cv}}
            </a>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="hero-visual">
          <div class="profile-image-container">
            <img
              src="images/profile/photo.jpeg"
              alt="Philibert Pappens"
              class="profile-image"
              loading="eager"
              fetchpriority="high"
              decoding="async"
            />
            <div class="image-placeholder">
              <span>images/profile/photo.jpeg</span>
            </div>
          </div>

          <div class="hero-info-card">
            <h3 class="info-card-title">
              {{ui.accueil.currently}}
            </h3>
            <ul class="info-list mb-0">
              {{#ui.accueil.info_items}}
              <li>
                {{text}}
              </li>
              {{/ui.accueil.info_items}}
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
